<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>4bsensi — Smart Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{--bg:#080808;--panel:#111;--panel2:#171717;--line:#292929;--muted:#929292;--white:#f7f7f7;--soft:#d8d8d8;--radius:22px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{padding:28px 18px;border-right:1px solid var(--line);background:#0b0b0b;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px}.brand-mark{width:43px;height:43px;border:1px solid #555;border-radius:14px;display:grid;place-items:center;font-weight:800;letter-spacing:-3px;font-size:17px;background:linear-gradient(145deg,#222,#080808);box-shadow:inset 0 1px #555}.brand-name{font-weight:800;letter-spacing:-.8px;font-size:19px}.brand-name span{color:#888}
.nav-label{font-size:10px;color:#666;font-weight:800;letter-spacing:1.8px;padding:0 12px;margin-bottom:4px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#999;text-align:left;padding:13px 14px;border-radius:13px;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:600;transition:.2s}.nav button:hover,.nav button.active{background:#202020;color:white}.nav .ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.user-mini{border-top:1px solid var(--line);padding:18px 8px 0;display:flex;align-items:center;gap:10px}.avatar{width:37px;height:37px;border-radius:50%;background:#292929;display:grid;place-items:center;font-size:13px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.user-mini strong{font-size:12px;display:block}.user-mini small{font-size:10px;color:#888}
main{padding:34px clamp(18px,4vw,56px);max-width:1500px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;gap:12px}.eyebrow{font-size:10px;letter-spacing:2px;color:#888;font-weight:800;text-transform:uppercase}.page-title{font-size:clamp(25px,3vw,36px);letter-spacing:-1.8px;margin:7px 0 0;font-weight:800}.top-right{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:#aaa;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;min-width:0;animation:rise .45s ease both}.stat{grid-column:span 3;min-height:135px}.stat-top{display:flex;justify-content:space-between;color:#999;font-size:12px}.stat-icon{width:30px;height:30px;background:#222;border-radius:10px;display:grid;place-items:center;color:white}.stat-num{font-size:31px;font-weight:800;letter-spacing:-1.5px;margin-top:18px}.stat-foot{font-size:10px;color:#777;margin-top:3px}
.wide{grid-column:span 8}.narrow{grid-column:span 4}.full{grid-column:1/-1}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}.card h3{margin:0;font-size:14px;letter-spacing:-.3px}.muted{color:#888;font-size:11px}.btn{background:#f5f5f5;color:#080808;border-radius:12px;padding:12px 16px;font-size:12px;font-weight:800;transition:transform .2s,opacity .2s}.btn:hover{transform:translateY(-2px);opacity:.9}.btn.secondary{background:#222;color:#eee;border:1px solid #333}.btn.ghost{background:transparent;color:#ddd;border:1px solid #333}.btn.danger{background:#351b1b;color:#ffbcbc}.btn.small{padding:9px 12px;font-size:11px}
table{width:100%;border-collapse:collapse;text-align:left}th{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:1px;padding:12px 8px;border-bottom:1px solid var(--line)}td{font-size:11px;color:#ddd;padding:14px 8px;border-bottom:1px solid #202020}tr:last-child td{border:0}.status{padding:6px 9px;border-radius:99px;font-size:9px;font-weight:800;background:#202020;color:#eee}.status.present{background:#173021;color:#a8e8bc}.status.late{background:#382d18;color:#f0d28b}.status.absent{background:#351b1b;color:#ffaaaa}
.empty{padding:28px;text-align:center;color:#777;font-size:12px}.hero{grid-column:span 12;background:linear-gradient(110deg,#171717,#0e0e0e);display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:155px}.hero h2{font-size:25px;letter-spacing:-1.2px;margin:8px 0}.hero p{font-size:11px;color:#999;margin:0}.hero-symbol{font-size:76px;font-weight:800;letter-spacing:-12px;color:#333;padding-right:22px}
.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:10px;color:#aaa;font-weight:700}.field input,.field select{width:100%;background:#090909;border:1px solid #303030;color:white;border-radius:12px;padding:13px 14px;outline:none;font-size:12px}.field input:focus,.field select:focus{border-color:#aaa}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.auth-art{padding:8vw;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 20% 25%,#292929 0,transparent 48%),linear-gradient(135deg,#151515,#070707);border-right:1px solid #242424}.auth-art .big-logo{font-size:clamp(100px,18vw,230px);font-weight:800;letter-spacing:-.13em;line-height:1;color:#f4f4f4}.auth-art h2{font-size:clamp(24px,3vw,42px);letter-spacing:-1.8px;max-width:430px;margin:0}.auth-art p{font-size:12px;color:#888;max-width:360px;line-height:1.8}.auth-box{display:flex;align-items:center;justify-content:center;padding:30px}.auth-card{width:min(100%,390px)}.auth-card h1{font-size:28px;letter-spacing:-1.2px;margin:0 0 8px}.auth-card>p{font-size:11px;color:#888;margin:0 0 28px}.switch-auth{font-size:11px;color:#888;margin-top:20px;text-align:center}.link{color:white;text-decoration:underline;cursor:pointer;font-weight:700}
.modal-back{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(100%,480px);background:#111;border:1px solid #333;border-radius:24px;padding:24px;max-height:90vh;overflow:auto}.modal h2{font-size:19px;margin:0 0 6px}.modal p{font-size:11px;color:#888;margin:0 0 20px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.qr-box{background:white;padding:15px;border-radius:18px;width:max-content;margin:20px auto}.qr-box img{display:block}.scan-area{border-radius:14px;overflow:hidden;background:#050505}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f5f5f5;color:#080808;padding:12px 18px;border-radius:99px;font-size:11px;font-weight:800;z-index:10;box-shadow:0 10px 40px #0008;animation:rise .2s ease}
.profile-row{display:flex;align-items:center;gap:18px;margin-bottom:25px}.profile-big{width:70px;height:70px;border-radius:22px;background:#252525;display:grid;place-items:center;font-size:24px;font-weight:800;overflow:hidden}.profile-big img{width:100%;height:100%;object-fit:cover}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:3;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:14px}.brand{padding:0}.brand-mark{width:36px;height:36px}.nav-label,.side-bottom{display:none}.nav{display:flex;overflow:auto;flex:1}.nav button{white-space:nowrap;padding:10px}.nav button .ico{display:none}main{padding-top:24px}.stat{grid-column:span 6}.wide,.narrow{grid-column:span 12}.auth-wrap{grid-template-columns:1fr}.auth-art{display:none}.auth-box{min-height:100vh}}
@media(max-width:480px){.sidebar{gap:8px}.brand-name{font-size:15px}.brand-mark{width:32px;height:32px}.nav button{font-size:10px;padding:9px}.topbar{align-items:flex-start}.top-right .pill{display:none}.stat{padding:16px;min-height:120px}.stat-num{font-size:26px}.card{padding:17px}.form-row{grid-template-columns:1fr}.hero-symbol{display:none}td{font-size:10px;padding:12px 5px}th{font-size:8px;padding:9px 5px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const KEY='4bsensi_demo_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"users":[],"sessions":[],"records":[]}');
let current=JSON.parse(sessionStorage.getItem('4bsensi_user')||'null');
let activePage='dashboard', scanner=null;
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>(n||'4B').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const dateNow=()=>new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
const timeNow=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function toast(t){$('#toastRoot').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function avatar(u,cls='avatar'){return `<div class="${cls}">${u?.photo?`<img src="${u.photo}">`:esc(initials(u?.name))}</div>`}
function auth(){ $('#app').innerHTML=`<div class="auth-wrap"><section class="auth-art"><div class="brand"><div class="brand-mark">4B</div><div class="brand-name">4bsensi<span>.</span></div></div><div><div class="big-logo">4B</div><h2>Attendance, made effortless.</h2><p>Satu ruang untuk kehadiran yang lebih tertata. Cepat, simpel, dan fokus pada hal yang penting.</p></div><div class="eyebrow">SMART ATTENDANCE PLATFORM · 2026</div></section><section class="auth-box"><div class="auth-card" id="authCard"></div></section></div>`;loginForm()}
function loginForm(){ $('#authCard').innerHTML=`<div class="eyebrow">WELCOME BACK</div><h1>Masuk ke 4bsensi</h1><p>Kelola kehadiranmu dalam satu tempat.</p><form id="loginForm"><div class="field"><label>EMAIL</label><input name="email" type="email" placeholder="nama@email.com" required></div><div class="field"><label>PASSWORD</label><input name="password" type="password" placeholder="Masukkan password" required></div><button class="btn" style="width:100%">Masuk ke akun →</button></form><div class="switch-auth">Belum punya akun? <span class="link" onclick="registerForm()">Buat akun baru</span></div><p style="margin-top:22px;font-size:10px">Demo lokal: data tersimpan di browser perangkat ini.</p>`;$('#loginForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),u=db.users.find(x=>x.email.toLowerCase()===f.get('email').toLowerCase()&&x.password===f.get('password'));if(!u)return toast('Email atau password salah');current=u;sessionStorage.setItem('4bsensi_user',JSON.stringify(u));render()}}
function registerForm(){ $('#authCard').innerHTML=`<div class="eyebrow">GET STARTED</div><h1>Buat akun baru</h1><p>Mulai gunakan 4bsensi hari ini.</p><form id="regForm"><div class="field"><label>NAMA LENGKAP</label><input name="name" placeholder="Nama kamu" required></div><div class="field"><label>EMAIL</label><input name="email" type="email" placeholder="nama@email.com" required></div><div class="field"><label>PASSWORD</label><input name="password" type="password" minlength="6" placeholder="Minimal 6 karakter" required></div><div class="field"><label>DAFTAR SEBAGAI</label><select name="role"><option value="student">Mahasiswa / Pelajar</option><option value="admin">Admin / Guru / Dosen</option></select></div><div class="field"><label>INSTITUSI / SEKOLAH</label><input name="school" placeholder="Nama institusi"></div><button class="btn" style="width:100%">Buat akun →</button></form><div class="switch-auth">Sudah punya akun? <span class="link" onclick="loginForm()">Masuk</span></div>`;$('#regForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),email=f.get('email').trim().toLowerCase();if(db.users.some(x=>x.email===email))return toast('Email sudah terdaftar');let u={id:crypto.randomUUID(),name:f.get('name').trim(),email,password:f.get('password'),role:f.get('role'),school:f.get('school'),photo:''};db.users.push(u);save();current=u;sessionStorage.setItem('4bsensi_user',JSON.stringify(u));render();toast('Akun berhasil dibuat')}}
function render(){if(!current){auth();return}let u=db.users.find(x=>x.id===current.id);if(!u){current=null;auth();return}current=u;sessionStorage.setItem('4bsensi_user',JSON.stringify(u));const admin=u.role==='admin';$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">4B</div><div class="brand-name">4bsensi<span>.</span></div></div><div style="flex:1"><div class="nav-label">MENU UTAMA</div><nav class="nav"><button class="${activePage==='dashboard'?'active':''}" onclick="go('dashboard')"><span class="ico">⌂</span>Dashboard</button><button class="${activePage==='attendance'?'active':''}" onclick="go('attendance')"><span class="ico">▦</span>${admin?'Sesi Absensi':'Scan Absensi'}</button><button class="${activePage==='history'?'active':''}" onclick="go('history')"><span class="ico">◷</span>Riwayat</button><button class="${activePage==='profile'?'active':''}" onclick="go('profile')"><span class="ico">◎</span>Profil Saya</button></nav></div><div class="side-bottom"><div class="user-mini">${avatar(u)}<div style="min-width:0;flex:1"><strong>${esc(u.name)}</strong><small>${admin?'Admin / Pengajar':'Mahasiswa / Pelajar'}</small></div><button class="btn ghost small" onclick="logout()">↗</button></div></div></aside><main><div class="topbar"><div><div class="eyebrow">${esc(u.school||'PERSONAL WORKSPACE')}</div><h1 class="page-title">${pageTitle()}</h1></div><div class="top-right"><span class="pill">${dateNow()}</span>${avatar(u)}</div></div><div id="content"></div></main></div>`;pageContent()}
function pageTitle(){return ({dashboard:'Dashboard',attendance:current.role==='admin'?'Kelola Absensi':'Scan Kehadiran',history:'Riwayat Kehadiran',profile:'Profil Saya'})[activePage]}
function go(p){activePage=p;render()}
function logout(){current=null;sessionStorage.removeItem('4bsensi_user');activePage='dashboard';auth()}
function pageContent(){let u=current,admin=u.role==='admin',mine=db.records.filter(r=>r.userId===u.id),sessions=admin?db.sessions.filter(s=>s.ownerId===u.id):db.sessions;
if(activePage==='dashboard'){let present=mine.filter(r=>r.status==='Hadir').length;$('#content').innerHTML=`<div class="grid"><section class="card hero"><div><div class="eyebrow">HELLO, ${esc(u.name.split(' ')[0]).toUpperCase()}</div><h2>${admin?'Kelola kelas dengan lebih mudah.':'Siap mencatat kehadiran hari ini?'}</h2><p>${admin?'Buat sesi, tampilkan QR, dan pantau kehadiran peserta.':'Scan QR dari pengajar untuk mencatat kehadiranmu.'}</p><div style="margin-top:18px"><button class="btn" onclick="go('attendance')">${admin?'Buat sesi absensi':'Scan sekarang'} →</button></div></div><div class="hero-symbol">4B</div></section><div class="card stat"><div class="stat-top">Total kehadiran <span class="stat-icon">✓</span></div><div class="stat-num">${admin?db.records.filter(r=>sessions.some(s=>s.id===r.sessionId)).length:present}</div><div class="stat-foot">Catatan kehadiran</div></div><div class="card stat"><div class="stat-top">${admin?'Sesi dibuat':'Total sesi tersedia'} <span class="stat-icon">▦</span></div><div class="stat-num">${sessions.length}</div><div class="stat-foot">Di ruang kerja ini</div></div><div class="card stat"><div class="stat-top">${admin?'Peserta tercatat':'Terlambat'} <span class="stat-icon">◷</span></div><div class="stat-num">${admin?new Set(db.records.filter(r=>sessions.some(s=>s.id===r.sessionId)).map(r=>r.userId)).size:mine.filter(r=>r.status==='Terlambat').length}</div><div class="stat-foot">Ringkasan aktivitas</div></div><div class="card stat"><div class="stat-top">Institusi <span class="stat-icon">⌂</span></div><div class="stat-num" style="font-size:17px;margin-top:25px">${esc(u.school||'—')}</div><div class="stat-foot">Profil akun</div></div><section class="card full"><div class="card-head"><h3>${admin?'Sesi terbaru':'Kehadiran terbaru'}</h3><button class="btn ghost small" onclick="go('${admin?'attendance':'history'}')">Lihat semua</button></div>${admin?sessionTable(sessions.slice().reverse().slice(0,5)):recordTable(mine.slice().reverse().slice(0,5))}</section></div>`}
else if(activePage==='attendance'){if(admin){$('#content').innerHTML=`<div class="grid"><section class="card wide"><div class="card-head"><div><h3>Buat sesi baru</h3><div class="muted" style="margin-top:5px">QR unik akan dibuat untuk setiap sesi.</div></div><span class="status">ADMIN</span></div><form id="sessionForm"><div class="field"><label>NAMA MATA PELAJARAN / KELAS</label><input name="subject" placeholder="Contoh: Matematika — Kelas 12A" required></div><div class="form-row"><div class="field"><label>TANGGAL</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>BATAS WAKTU (MENIT)</label><input name="duration" type="number" min="1" max="600" value="90" required></div></div><button class="btn">＋ Buat sesi & QR</button></form></section><section class="card narrow"><h3>Alur absensi</h3><p class="muted" style="line-height:1.9;margin-top:12px">01 — Buat sesi kelas.<br>02 — Tampilkan QR kepada peserta.<br>03 — Mahasiswa scan QR.<br>04 — Data masuk ke rekap.</p><div class="eyebrow" style="margin-top:20px">SECURE BY DESIGN</div><p class="muted">Untuk penggunaan nyata lintas perangkat, hubungkan ke backend/database online.</p></section><section class="card full"><div class="card-head"><h3>Sesi yang kamu buat</h3></div>${sessionTable(sessions.slice().reverse())}</section></div>`;$('#sessionForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),s={id:crypto.randomUUID(),token:crypto.randomUUID(),ownerId:u.id,subject:f.get('subject'),date:f.get('date'),duration:+f.get('duration'),created:Date.now(),active:true};db.sessions.push(s);save();showQR(s.id);render();toast('Sesi absensi dibuat')}}
else{$('#content').innerHTML=`<div class="grid"><section class="card wide"><div class="card-head"><div><h3>Scan QR absensi</h3><div class="muted" style="margin-top:5px">Arahkan kamera ke QR dari pengajar.</div></div><span class="status">STUDENT</span></div><div id="reader" class="scan-area"></div><div class="muted" style="margin:14px 0">Kamera memerlukan izin akses dan koneksi HTTPS (atau localhost).</div><button class="btn" onclick="startScan()">Aktifkan kamera</button></section><section class="card narrow"><h3>Petunjuk</h3><p class="muted" style="line-height:2">Pastikan QR masih aktif.<br>Gunakan kamera belakang HP.<br>Tunggu konfirmasi setelah scan.<br>Periksa riwayat untuk memastikan absensi tercatat.</p></section><section class="card full"><div class="card-head"><h3>Sesi tersedia di demo ini</h3></div>${sessionTable(sessions.filter(s=>s.active))}</section></div>`}}
else if(activePage==='history'){$('#content').innerHTML=`<section class="card full"><div class="card-head"><h3>${admin?'Rekap seluruh sesi':'Riwayat kehadiran saya'}</h3><button class="btn ghost small" onclick="exportCSV()">↓ Export CSV</button></div>${admin?recordTable(db.records.filter(r=>sessions.some(s=>s.id===r.sessionId)).slice().reverse()):recordTable(mine.slice().reverse())}</section>`}
else if(activePage==='profile'){$('#content').innerHTML=`<section class="card" style="max-width:720px"><div class="profile-row">${avatar(u,'profile-big')}<div><h3 style="font-size:17px;margin:0 0 5px">${esc(u.name)}</h3><div class="muted">${esc(u.email)}</div></div></div><form id="profileForm"><div class="form-row"><div class="field"><label>NAMA LENGKAP</label><input name="name" value="${esc(u.name)}" required></div><div class="field"><label>EMAIL</label><input value="${esc(u.email)}" disabled></div></div><div class="field"><label>INSTITUSI</label><input name="school" value="${esc(u.school||'')}" placeholder="Nama sekolah / kampus"></div><div class="field"><label>FOTO PROFIL</label><input name="photo" type="file" accept="image/*"></div><div class="field"><label>GANTI PASSWORD (OPSIONAL)</label><input name="password" type="password" minlength="6" placeholder="Isi jika ingin mengganti"></div><button class="btn">Simpan perubahan</button></form></section>`;$('#profileForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);u.name=f.get('name');u.school=f.get('school');if(f.get('password'))u.password=f.get('password');let file=f.get('photo');if(file.size){if(file.size>1500000)return toast('Ukuran foto maksimal 1,5 MB');u.photo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})}save();current=u;render();toast('Profil diperbarui')}}
}
function sessionTable(arr){if(!arr.length)return '<div class="empty">Belum ada sesi absensi.</div>';return `<div style="overflow:auto"><table><thead><tr><th>Mata pelajaran</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${arr.map(s=>`<tr><td><b>${esc(s.subject)}</b></td><td>${esc(s.date)}</td><td><span class="status ${s.active?'present':'absent'}">${s.active?'Aktif':'Ditutup'}</span></td><td><button class="btn ghost small" onclick="showQR('${s.id}')">Lihat QR</button> <button class="btn ghost small" onclick="toggleSession('${s.id}')">${s.active?'Tutup':'Aktifkan'}</button></td></tr>`).join('')}</tbody></table></div>`}
function recordTable(arr){if(!arr.length)return '<div class="empty">Belum ada data kehadiran.</div>';return `<div style="overflow:auto"><table><thead><tr><th>Nama</th><th>Kelas / Sesi</th><th>Tanggal</th><th>Waktu</th><th>Status</th></tr></thead><tbody>${arr.map(r=>{let person=db.users.find(x=>x.id===r.userId),s=db.sessions.find(x=>x.id===r.sessionId);return `<tr><td>${esc(person?.name||'Pengguna')}</td><td>${esc(s?.subject||'Sesi dihapus')}</td><td>${esc(r.date)}</td><td>${esc(r.time)}</td><td><span class="status ${r.status==='Hadir'?'present':r.status==='Terlambat'?'late':'absent'}">${esc(r.status)}</span></td></tr>`}).join('')}</tbody></table></div>`}
function showQR(id){let s=db.sessions.find(x=>x.id===id);if(!s)return;$('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="eyebrow">SESSION QR CODE</div><h2>${esc(s.subject)}</h2><p>${esc(s.date)} · ${s.duration} menit · ${s.active?'Aktif':'Ditutup'}</p><div id="qrcode" class="qr-box"></div><div style="text-align:center;font-size:10px;color:#777">Tunjukkan QR ini kepada mahasiswa untuk dipindai.</div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Tutup</button><button class="btn" onclick="downloadQR()">Unduh QR</button></div></div></div>`;setTimeout(()=>{if(window.QRCode)new QRCode($('#qrcode'),{text:'4BSENSI:'+s.id+':'+s.token,width:220,height:220,colorDark:'#080808',colorLight:'#ffffff',correctLevel:QRCode.CORRECT_LEVEL.H})},50)}
function closeModal(){if(scanner){scanner.stop().catch(()=>{});scanner=null}$('#modalRoot').innerHTML=''}
function downloadQR(){let img=$('#qrcode img');if(!img)return;let a=document.createElement('a');a.href=img.src;a.download='4bsensi-qr.png';a.click()}
function toggleSession(id){let s=db.sessions.find(x=>x.id===id);s.active=!s.active;save();render();toast(s.active?'Sesi diaktifkan':'Sesi ditutup')}
async function startScan(){if(!window.Html5Qrcode)return toast('Library scanner belum termuat. Periksa koneksi internet.');try{if(scanner){await scanner.stop().catch(()=>{});scanner=null}scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},decoded=>{scanner.stop().catch(()=>{});scanner=null;processQR(decoded)},()=>{})}catch(e){toast('Tidak bisa membuka kamera. Izinkan akses kamera dan gunakan HTTPS.')}}
function processQR(text){let p=text.split(':');if(p.length!==3||p[0]!=='4BSENSI')return toast('QR bukan milik 4bsensi');let s=db.sessions.find(x=>x.id===p[1]&&x.token===p[2]);if(!s)return toast('Sesi tidak ditemukan di database demo perangkat ini');if(!s.active)return toast('Sesi absensi sudah ditutup');if(db.records.some(r=>r.sessionId===s.id&&r.userId===current.id))return toast('Kamu sudah tercatat hadir');let elapsed=(Date.now()-s.created)/60000,status=elapsed>s.duration?'Terlambat':'Hadir';db.records.push({id:crypto.randomUUID(),sessionId:s.id,userId:current.id,date:dateNow(),time:timeNow(),status});save();render();toast('Absensi berhasil: '+status)}
function exportCSV(){let rows=current.role==='admin'?db.records.filter(r=>db.sessions.some(s=>s.id===r.sessionId)):db.records.filter(r=>r.userId===current.id);let lines=[['Nama','Email','Sesi','Tanggal','Waktu','Status'],...rows.map(r=>{let u=db.users.find(x=>x.id===r.userId),s=db.sessions.find(x=>x.id===r.sessionId);return [u?.name,u?.email,s?.subject,r.date,r.time,r.status]})];let csv=lines.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='4bsensi-rekap.csv';a.click();URL.revokeObjectURL(a.href)}
render();
</script>
</body>
